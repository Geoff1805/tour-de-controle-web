name: Android CI & Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew

      - name: Build Release APK
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Building APK with versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          cd android
          ./gradlew assembleRelease -PappVersionCode="${VERSION_CODE}" -PappVersionName="${VERSION_NAME}"

      - name: Prepare Normalized APK
        run: |
          mkdir -p build-artifacts
          VERSION_NAME="1.0.${{ github.run_number }}"
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          NORMALIZED_NAME="AntigravityController-v${VERSION_NAME}.apk"
          cp "$APK_FILE" "build-artifacts/${NORMALIZED_NAME}"
          cp "$APK_FILE" "build-artifacts/AntigravityController.apk"
          ls -lh build-artifacts/

      - name: Upload Normalized APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityController-APK
          path: build-artifacts/AntigravityController-v*.apk
          retention-days: 7

      - name: Publish Direct Unzipped APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          NORMALIZED_APK="build-artifacts/AntigravityController-v${VERSION_NAME}.apk"
          echo "Publishing direct $NORMALIZED_APK for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NORMALIZED_APK" --clobber
          else
            gh release create "$TAG" "$NORMALIZED_APK" \
              --title "Antigravity Controller v${VERSION_NAME}" \
              --notes "Version ${VERSION_NAME} unifiée (Web + APK nomade). Fichier APK brut directement installable par InstallAPK."
          fi
